name: macos

on:
  pull_request:
    branches:
    - main

jobs:
  macos-x64:
    runs-on: macos-13
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Prepare
        run: |
          source $GITHUB_WORKSPACE/scripts/prepare_macos_x64_debug.sh
        shell: bash
      - name: Check virtual environment
        run: |
          which python3 && python3 -V
          which conan && conan -v
          which cmake && cmake --version
      - name: Configure
        run: |
          cmake --preset 'conan-debug'
      - name: Build
        run: |
          ninja -j$(nproc) -C $GITHUB_WORKSPACE/build/Debug/
      - name: Run tests
        run: |
          ninja -j$(nproc) test -C $GITHUB_WORKSPACE/build/Debug/
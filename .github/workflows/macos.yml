          source $GITHUB_WORKSPACE/scripts/prepare_macos_x64_debug.sh
          echo PATH=${GITHUB_WORKSPACE}/.venv/bin:$PATH >> $GITHUB_ENV
      - name: Check virtual environment
        run: |
          which python3 && python3 -V
          which conan && conan -v
          which cmake && cmake --version
      - name: Configure
        run: |
